[package]
name = "nih_plug_egui"
version = "0.0.0"
edition = "2021"
authors = ["Robbert van der Helm <mail@robbertvanderhelm.nl>"]
license = "ISC"

description = "An adapter to use egui GUIs with NIH-plug"

[features]
default = ["opengl", "default_fonts"]
# `nih_plug_egui` always uses OpenGL since egui's wgpu backend is still unstable
# depending on the platform
opengl = ["egui-baseview/opengl"]
default_fonts = ["egui-baseview/default_fonts"]
rayon = ["egui-baseview/rayon"]

[dependencies]
nih_plug = { path = "..", default-features = false }
raw-window-handle = "0.5"
# Must be the SAME git source as egui-baseview's baseview dep, or the two copies
# produce incompatible WindowHandle types. Fork with the x11 reactive idle-wait
# patch (IdleWait/Waker).
baseview = { git = "https://github.com/hlavnjak/baseview", branch = "reactive-idle-wait" }
crossbeam = "0.8"
# Fork of BillyDM/egui-baseview @ ec70c3f with a reactive frame gate in on_frame
# (skip the whole build+render when idle).
egui-baseview = { git = "https://github.com/hlavnjak/egui-baseview", branch = "reactive-idle-wait" }
parking_lot = "0.12"
# To make the state persistable
serde = { version = "1.0", features = ["derive"] }
